<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Tracker - Live Room Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-content">
                <div>
                    <h1 class="room-title">Kamar 302</h1>
                    <p class="room-subtitle">Pelacakan Persiapan Kamar</p>
                </div>
                <div class="live-badge" id="live-badge">
                    <span class="pulse-dot"></span>
                    <span id="live-text">MEMUAT SISTEM</span>
                </div>
            </div>
        </header>

        <main class="main-dashboard">
            <section class="stepper-section">
                <div class="stepper">
                    <div class="step active" id="step-1">
                        <div class="step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <div class="step-text">Check-in</div>
                    </div>
                    <div class="step-line" id="line-1"></div>
                    
                    <div class="step" id="step-2">
                        <div class="step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        </div>
                        <div class="step-text">Inspeksi</div>
                    </div>
                    <div class="step-line" id="line-2"></div>
                    
                    <div class="step" id="step-3">
                        <div class="step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </div>
                        <div class="step-text">Pembersihan</div>
                    </div>
                    <div class="step-line" id="line-3"></div>
                    
                    <div class="step" id="step-4">
                        <div class="step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="step-text">Kamar Siap</div>
                    </div>
                </div>
            </section>

            <div class="grid-layout">
                <section class="camera-section">
                    <div class="camera-card">
                        <div class="camera-header">
                            <h2>Live Housekeeping Cam</h2>
                            <div class="rec-indicator">
                                <span class="rec-dot"></span> REC
                            </div>
                        </div>
                        <div class="video-wrapper">
                            <div class="video-placeholder">Menunggu Akses Kamera...</div>
                            <video id="housekeeping-cam" autoplay playsinline muted></video>
                            <div class="camera-overlay">
                                <span id="cam-time">00:00:00</span>
                                <span>CAM-HK-01</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="status-section">
                    <div class="status-card">
                        <h2 class="status-heading">Progress Pekerjaan</h2>
                        <div class="progress-display">
                            <div class="percentage" id="percentage-text">0%</div>
                            <div class="status-label" id="status-label">Menyiapkan Data...</div>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        
                        <div class="progress-markers">
                            <span>0%</span>
                            <span>25%</span>
                            <span>50%</span>
                            <span>75%</span>
                            <span>100%</span>
                        </div>

                        <div class="alert-box" id="alert-box">
                            <div class="alert-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                            </div>
                            <div class="alert-text">
                                <strong>Pemberitahuan</strong>
                                <p id="alert-message">Mohon tunggu, housekeeping sedang menuju kamar Anda.</p>
                            </div>
                        </div>
                        
                        <button class="action-btn" id="action-btn" disabled>Ambil Kunci Kamar</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const videoElement = document.getElementById('housekeeping-cam');
        const camTimeElement = document.getElementById('cam-time');
        const percentageText = document.getElementById('percentage-text');
        const progressFill = document.getElementById('progress-fill');
        const statusLabel = document.getElementById('status-label');
        const liveBadge = document.getElementById('live-badge');
        const liveText = document.getElementById('live-text');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const actionBtn = document.getElementById('action-btn');

        const s1 = document.getElementById('step-1');
        const s2 = document.getElementById('step-2');
        const s3 = document.getElementById('step-3');
        const s4 = document.getElementById('step-4');
        const l1 = document.getElementById('line-1');
        const l2 = document.getElementById('line-2');
        const l3 = document.getElementById('line-3');

        let progress = 0;
        let simulationInterval;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
            } catch (err) {
                document.querySelector('.video-placeholder').innerText = "Kamera tidak ditemukan atau akses ditolak.";
            }
        }

        function updateTime() {
            const now = new Date();
            camTimeElement.innerText = now.toLocaleTimeString('id-ID');
        }

        function updateUI(val) {
            percentageText.innerText = val + '%';
            progressFill.style.width = val + '%';

            if (val >= 0 && val < 25) {
                statusLabel.innerText = "Front Office Mengecek Kamar";
                alertMessage.innerText = "Sistem sedang memverifikasi ketersediaan kamar Anda.";
                s1.classList.add('active');
            } else if (val >= 25 && val < 50) {
                statusLabel.innerText = "Housekeeping Tiba di Kamar";
                alertMessage.innerText = "Petugas mulai mempersiapkan perlengkapan kebersihan.";
                s2.classList.add('active');
                l1.classList.add('active');
            } else if (val >= 50 && val < 100) {
                statusLabel.innerText = "Proses Pembersihan Berlangsung";
                alertMessage.innerText = "Membersihkan area kamar dan mengganti linen.";
                s3.classList.add('active');
                l2.classList.add('active');
            } else if (val === 100) {
                statusLabel.innerText = "Kamar Telah Siap";
                statusLabel.style.color = "var(--success)";
                percentageText.style.color = "var(--success)";
                alertBox.classList.add('success-alert');
                alertMessage.innerText = "Kamar Anda sudah bersih dan siap untuk ditempati.";
                s4.classList.add('active');
                l3.classList.add('active');
                actionBtn.removeAttribute('disabled');
                actionBtn.classList.add('ready');
                liveBadge.classList.add('ready-badge');
                liveText.innerText = "KAMAR SIAP";
                clearInterval(simulationInterval);
            }
        }

        function startSimulation() {
            liveBadge.classList.add('active-badge');
            liveText.innerText = "LIVE STREAMING";
            
            simulationInterval = setInterval(() => {
                progress += 1;
                if (progress > 100) progress = 100;
                updateUI(progress);
            }, 500);
        }

        startCamera();
        setInterval(updateTime, 1000);
        setTimeout(startSimulation, 2000);
    </script>
</body>
</html>
